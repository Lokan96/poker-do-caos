name: Compilação do APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  compilar-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Compilar APK (Debug, assinado automaticamente)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PokerDoCaos-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Renomear APK para nome bonito (só release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ls android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk PokerDoCaos-${GITHUB_REF_NAME}.apk

      - name: Publicar Release (só em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PokerDoCaos-${GITHUB_REF_NAME}.apk
          name: "Pôquer do Caos ${GITHUB_REF_NAME}"
          body: |
            Release ${GITHUB_REF_NAME} do Pôquer do Caos.
            APK Android (debug assinado) para instalação direta.

            ## Como instalar
            1. Baixe o APK e envie-o ao celular (WhatsApp/Drive/cable);
            2. Toque no arquivo e permita "Instalar de fonte desconocida";
            3. Jogue offline. 🎰

            O código fonte completo está neste repositório (`app/`, `tools/`, `android/`).
            Relatório escolar: `relatorio.md` / `relatorio.docx`.